# Continuous integration for Compass Tools.
#
# This workflow only CHECKS code. It does not deploy, does not publish an image, does not touch the VPS, Cloudflare or any
# database other than throw-away containers it creates itself, and it uses no repository secrets. Deployment to the VPS is a
# deliberate manual step (docs/DEPLOYMENT_OVHCLOUD_CLOUDFLARE.md). Do not add a job here that can change production without
# a protected GitHub Environment with required reviewers.
#
# Actions are pinned to full commit SHAs (the version is in the comment); update them deliberately.
name: CI

on:
  pull_request:
  push:
    # feature/** so a branch is checked (including the Docker smoke test) as soon as it is pushed, without waiting for a pull request.
    # release/** so a dedicated release branch is checked the same way: deploy/deploy.sh --release-branch reads this workflow's results for the
    # exact commit it is asked to deploy. Checking a push never deploys anything.
    branches: [main, "feature/**", "release/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  static:
    name: Static checks (types, lint, schema, scripts, secret hygiene)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing in these jobs pushes or fetches again; keep the workflow token out of .git/config
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Install from the lockfile
        run: npm ci
      - name: Prisma schema is valid
        run: npx prisma validate
      - name: Generate the Next.js route types (LayoutProps, PageProps ...) that tsc needs in a fresh checkout
        run: npx next typegen
      - name: TypeScript
        run: npx tsc --noEmit
      - name: ESLint
        run: npm run lint
      - name: Shell scripts (shellcheck)
        run: shellcheck -x -S warning deploy/*.sh
      - name: No secrets or environment files are tracked
        run: |
          set -euo pipefail
          bad="$(git ls-files | grep -E '(^|/)\.env($|\.)' | grep -v '^\.env\.example$' || true)"
          [ -z "$bad" ] || { echo "Tracked environment file(s): $bad"; exit 1; }
          if git grep -nE -e '-----BEGIN ([A-Z]+ )?PRIVATE KEY-----' -- . ':!docs' ':!src/**/__tests__/**' ':!src/**/__integration__/**'; then
            echo "A private key appears to be committed."; exit 1
          fi
          # .env.example must contain placeholders only: no long base64/hex value assigned to a key/secret/token/password variable
          # (an obvious "replace-with-..." / "your-..." placeholder is fine).
          if grep -nE '^(POSTGRES_PASSWORD|TUNNEL_TOKEN|CARD_ENCRYPTION_KEY|GMAIL_TOKEN_ENCRYPTION_KEY|IP_ENCRYPTION_KEY|IP_HASH_KEY|CRON_SECRET|GOOGLE_CLIENT_SECRET)="[A-Za-z0-9+/=_-]{40,}"' .env.example | grep -vE '="(replace-with|your-)'; then
            echo ".env.example looks like it contains a real secret."; exit 1
          fi
          echo "clean"

  tests:
    name: Unit + real-database integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # A throw-away PostgreSQL started below. TLS is ON (self-signed), like the managed production database, so the
      # integration suites exercise the same connection path as production. (The plaintext-Docker path is covered by the smoke job.)
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/compass_test?sslmode=require
      INTEGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/compass_test?sslmode=require
      INTEGRATION_ADMIN_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres?sslmode=require
      INTEGRATION_SSL: "1"
      # NODE_TLS_REJECT_UNAUTHORIZED is deliberately NOT set (it used to be, for the whole job, which also switched off certificate checks for `npm ci`). The test
      # database's own certificate is trusted for the one step that needs it instead (NODE_EXTRA_CA_CERTS on the test step below).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing in these jobs pushes or fetches again; keep the workflow token out of .git/config
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
      - name: Start PostgreSQL 17 with TLS
        run: |
          set -euo pipefail
          certs="$RUNNER_TEMP/pgtls"; mkdir -p "$certs"
          # A throw-away self-signed certificate that names the address the tests connect to (127.0.0.1), so a client can VERIFY it by trusting this one file.
          openssl req -new -x509 -days 2 -nodes -subj "/CN=localhost" -addext "subjectAltName=IP:127.0.0.1,DNS:localhost" \
            -keyout "$certs/server.key" -out "$certs/server.crt"
          sudo chown 999:999 "$certs/server.key" "$certs/server.crt"; sudo chmod 600 "$certs/server.key"
          # The database runs in the runner's OWN network namespace (--network host) and listens on 127.0.0.1 only. A published port (-p) would make the server see
          # a container-network address instead of loopback, and src/test/integration-database-guard.ts - which asks the server which address it answered from -
          # correctly refuses that, because a forwarded port looks exactly like a tunnel to somebody else's database. This runner is single-use and holds no other
          # database; the next step proves that nothing but loopback listens on the port.
          docker run -d --name ci-pg --network host -e POSTGRES_PASSWORD=postgres -v "$certs:/certs:ro" \
            postgres:17.11-bookworm@sha256:3645570cccdfa447589da9f57dd740faa29b30938e861289a5574b6ca6b03826 \
            -c listen_addresses=127.0.0.1 -c port=5432 \
            -c ssl=on -c ssl_cert_file=/certs/server.crt -c ssl_key_file=/certs/server.key -c max_connections=100
          for i in $(seq 1 30); do docker exec ci-pg pg_isready -U postgres >/dev/null 2>&1 && break; sleep 2; done
          docker exec ci-pg psql -U postgres -c 'CREATE DATABASE compass_test'
      - name: The test database listens on loopback only
        run: |
          set -euo pipefail
          listeners="$(ss -H -ltn 'sport = :5432' | awk '{print $4}')"
          echo "listening on port 5432: ${listeners:-nothing}"
          [ -n "$listeners" ] || { echo "nothing is listening on 5432"; exit 1; }
          # every listener must be exactly 127.0.0.1:5432 or [::1]:5432 - a wildcard (0.0.0.0, [::], *) or any other address fails the job
          if echo "$listeners" | grep -qvE '^(127\.0\.0\.1|\[::1\]):5432$'; then echo "the test database must not listen on anything but loopback"; exit 1; fi
      - run: npm ci
      - name: Apply the migrations to the empty test database
        run: npx prisma migrate deploy
      - name: Prisma migrations match schema.prisma (no schema change without a migration)
        run: bash deploy/check-migration-drift.sh
      - name: Tests (serial, like the reference run)
        env:
          # Trust ONLY the throw-away certificate of the test database (in addition to the normal roots); verification stays ON for every other TLS connection.
          NODE_EXTRA_CA_CERTS: ${{ runner.temp }}/pgtls/server.crt
        run: npx vitest run --no-file-parallelism

  docker:
    name: Docker image + Compose smoke test (plaintext private database)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing in these jobs pushes or fetches again; keep the workflow token out of .git/config
      - name: Build, migrate, boot and probe the stack
        # On failure the last lines of the output are also published as a workflow ANNOTATION (readable on the run page and through the
        # public check-run API without repository admin rights). The smoke test uses throw-away random values only; nothing secret is logged.
        run: |
          set +e
          bash deploy/ci-smoke.sh 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            msg="$(tail -n 70 "$RUNNER_TEMP/smoke.log" | cut -c1-300 | sed -e 's/%/%25/g' | awk 'BEGIN{ORS="%0A"}{print}')"
            echo "::error title=Docker smoke test failed (exit $rc)::$msg"
          fi
          exit "$rc"

  audit:
    name: Dependency audit (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Reports, never blocks: fixes are major-version decisions that need compatibility testing (see the guide, "Dependency audit").
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing in these jobs pushes or fetches again; keep the workflow token out of .git/config
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev || true
      - name: npm audit (all dependencies)
        run: npm audit || true
